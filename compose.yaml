version: '3.8'

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: festpass
      POSTGRES_USER: festpass
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U festpass -d festpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      - REGNO=12345637
      - DB_HOST=db
      - DB_NAME=festpass
      - DB_USER=festpass
      - DB_PASSWORD=${DB_PASSWORD}
      - APP_VERSION=dev
    networks:
      - frontend-net
      - backend-net
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:1.30-alpine
    ports:
      - "8037:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend-net
    depends_on:
      - backend

volumes:
  pgdata:

networks:
  frontend-net:
  backend-net:
    internal: true